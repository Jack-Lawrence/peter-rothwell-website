# Checks every change (including commits from the admin area) before it goes live.
# The deploy workflow waits for this to pass on main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Match the deploy workflow: the preview build is noindex, so Lighthouse
      # skips SEO. Remove this along with PREVIEW in deploy.yml at launch.
      PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Resized photos from earlier builds (after npm ci, which clears node_modules).
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**', 'src/content/**', 'package-lock.json') }}
          restore-keys: astro-images-

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Type check (astro check)
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Internal links (offline)
        run: npm run check:links

      - name: HTML validation
        run: npm run validate:html

      - name: SEO basics (titles, descriptions, canonical, share images)
        run: npm run check:seo

      - name: Lighthouse (mobile)
        run: npm run lhci

      # Playwright's headless Chromium, cached between runs. GitHub's runners
      # already have the system libraries it needs (they ship with Chrome).
      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --only-shell

      # Builds its own copy under /peter-rothwell-website/ (dist-e2e/), so base-path bugs show up.
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Keep the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore
          retention-days: 14
