# Builds the site and publishes it to GitHub Pages.
# Runs after the Checks workflow passes on main (so a change that breaks the
# site never goes live), by hand, and hourly so new Instagram posts appear
# (the hourly run is skipped until there's an Instagram token: see the gate job).
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The hourly run only exists to pick up new Instagram posts. Until the
  # IG_ACCESS_TOKEN secret is set there's nothing new to fetch, so it would just
  # redeploy the same site 24 times a day. Secrets can't be read in a job-level
  # `if`, so this job checks for the token and the build job is gated on its
  # output. Pushes (after Checks) and manual runs always deploy.
  gate:
    # After a push, only deploy when the checks passed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          HAS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN != '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "No Instagram token yet, so the hourly rebuild is skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The exact commit the checks ran on (the latest main for other triggers).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Resized photos from earlier builds (after npm ci, which clears node_modules).
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**', 'src/content/**', 'package-lock.json') }}
          restore-keys: astro-images-

      - name: Fetch latest Instagram posts
        run: node scripts/fetch-instagram.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Client preview: noindex, disallow-all robots.txt and a "not live" bar.
          # Remove this line when the site goes live.
          PREVIEW: 'true'

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
